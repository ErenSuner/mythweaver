<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e4dcc9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mythweaver" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Mythweaver — D&D 5e Karakter Sihirbazı</title>
    <meta
      name="description"
      content="D&D 5e için Türkçe, yeni oyuncu dostu, adım adım karakter oluşturma sihirbazı."
    />
    <link rel="canonical" href="https://mythweaver.com.tr/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mythweaver" />
    <meta property="og:url" content="https://mythweaver.com.tr/" />
    <meta property="og:title" content="Mythweaver — D&D 5e Karakter Sihirbazı" />
    <meta
      property="og:description"
      content="D&D 5e için Türkçe, yeni oyuncu dostu, adım adım karakter oluşturma sihirbazı."
    />
    <meta property="og:image" content="https://mythweaver.com.tr/icon.svg" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // FOUC engeli: React mount'undan once temayi koke bas. 'system' ise
      // hicbir oznitelik basilmaz; theme.css'teki prefers-color-scheme devreye girer.
      (function () {
        try {
          var p = localStorage.getItem('mythweaver:theme')
          if (p === 'light' || p === 'dark') document.documentElement.setAttribute('data-theme', p)
          var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', dark ? '#08080a' : '#e4dcc9')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
