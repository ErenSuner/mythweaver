# Ücretsiz DB yedeği — Supabase Pro'ya gerek yok.
# Her gün pg_dump alır, artifact olarak saklar (90 gün, GitHub ücretsiz).
# Ayrıca haftalık cron Supabase'i canlı tutar (free tier 7 gün inaktifte durur).
#
# Kurulum (tek seferlik):
#   GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#     SUPABASE_DB_URL = Supabase > Project Settings > Database > Connection string >
#                       "Session pooler" URI (şifreni içine yaz).
#   (Session pooler IPv4'tür; GitHub runner IPv4 — direct connection çalışmaz.)
#
# Elle çalıştır: repo > Actions > "DB Backup" > Run workflow.
# Yedeği indir: ilgili run > Artifacts > db-backup.

name: DB Backup

on:
  schedule:
    - cron: '0 3 * * *' # her gün 03:00 UTC
  workflow_dispatch: {} # elle tetikleme

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump (postgres 17 client, sürüm uyumu için docker)
        run: |
          mkdir -p out
          STAMP=$(date -u +%Y-%m-%d)
          docker run --rm \
            -e PGPASSWORD_UNUSED=1 \
            -v "${{ github.workspace }}/out:/out" \
            postgres:17-alpine \
            pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
              --format=custom \
              --no-owner --no-privileges \
              --file="/out/mythweaver-$STAMP.dump"
          ls -lh out

      - name: Yedeği artifact olarak yükle (90 gün)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: out/*.dump
          retention-days: 90
